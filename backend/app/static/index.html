<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Agent-Bench 控制台</title>
<style>
:root{--bg:#f6f8fa;--card:#fff;--ink:#1e293b;--sub:#64748b;--line:#e2e8f0;--brand:#2563eb;--ok:#16a34a;--bad:#dc2626}
*{box-sizing:border-box}body{margin:0;font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#0f172a;color:#fff;padding:10px 22px;display:flex;align-items:center;gap:18px}
header h1{font-size:17px;margin:0;font-weight:600}
nav{display:flex;gap:4px}
nav button{background:none;border:0;color:#cbd5e1;padding:6px 13px;border-radius:6px;cursor:pointer;font-size:13.5px}
nav button:hover{background:#1e293b}nav button.on{background:var(--brand);color:#fff}
main{max-width:1180px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 10px}h3{font-size:13.5px;margin:14px 0 6px;color:var(--sub)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{color:var(--sub);font-weight:600;background:#f8fafc}
button.act{background:var(--brand);color:#fff;border:0;border-radius:6px;padding:5px 12px;cursor:pointer;font-size:13px}
button.act:hover{opacity:.85}button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:13px}
input,select,textarea{border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:13px;font-family:inherit}
.pill{border-radius:999px;padding:1px 9px;font-size:12px;background:#f1f5f9;margin:1px}
.s-ok{color:var(--ok)}.s-bad{color:var(--bad)}.s-run{color:#d97706}
.bar{height:8px;background:#f1f5f9;border-radius:4px;overflow:hidden;min-width:110px}
.bar>div{height:100%;background:var(--brand)}
.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.muted{color:var(--sub);font-size:12.5px}
pre{background:#f8fafc;border:1px solid var(--line);border-radius:6px;padding:8px;font-size:12px;white-space:pre-wrap;word-break:break-all;max-height:300px;overflow:auto}
dialog{border:1px solid var(--line);border-radius:12px;padding:20px;max-width:720px;width:92%}
dialog::backdrop{background:#0006}
label{display:block;font-size:12.5px;color:var(--sub);margin:8px 0 3px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
a{color:var(--brand);text-decoration:none}
</style>
</head>
<body>
<header><h1>⚖ Agent-Bench 控制台</h1>
<nav>
  <button data-t="dash" class="on">仪表盘</button><button data-t="agents">Agent 管理</button>
  <button data-t="datasets">评测集管理</button><button data-t="runs">评测任务</button>
  <button data-t="gov">数据治理</button><button data-t="sys">系统设置</button>
</nav><span id="health" class="muted" style="color:#94a3b8;margin-left:auto"></span></header>
<main id="view"></main>

<dialog id="dlg"><div id="dlgBody"></div></dialog>

<script>
const $ = s => document.querySelector(s), view = $('#view'), dlg = $('#dlg'), dlgBody = $('#dlgBody');
// 统一 API 访问：附带可选 Bearer Token；401 时提示补填后重试一次
async function apiFetch(p, opt) {
  opt = opt || {};
  const token = localStorage.getItem('ab_token');
  if (token) opt.headers = Object.assign({}, opt.headers, {Authorization: 'Bearer ' + token});
  let r = await fetch('/api' + p, opt);
  if (r.status === 401) {
    const t = prompt('该服务已启用鉴权，请输入 AUTH_TOKEN：');
    if (t) {
      localStorage.setItem('ab_token', t);
      opt.headers = Object.assign({}, opt.headers, {Authorization: 'Bearer ' + t});
      r = await fetch('/api' + p, opt);
    }
  }
  return r;
}
const api = (p, opt) => apiFetch(p, opt).then(r => r.ok ? r.json() : r.json().then(e => Promise.reject(e)));
const post = (p, body) => apiFetch(p, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)}).then(r => r.ok ? r.json() : r.json().then(e => Promise.reject(e)));
const put = (p, body) => apiFetch(p, {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)}).then(r => r.ok ? r.json() : r.json().then(e => Promise.reject(e)));
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function openDlg(html){ dlgBody.innerHTML = html; dlg.showModal(); }
function closeDlg(){ dlg.close(); }
dlg.addEventListener('click', e => { if (e.target === dlg) closeDlg(); });

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); render(b.dataset.t);
});

// ---------- 仪表盘 ----------
async function dash(){
  const [runs, health] = await Promise.all([api('/runs'), api('/system/health')]);
  $('#health').textContent = `${health.llm_model} · trace: ${health.trace_mode}`;
  const done = runs.filter(r => r.status === 'done');
  const cards = [
    ['评测任务', runs.length], ['已完成', done.length],
    ['运行中', runs.filter(r => !['done','failed','cancelled','pending'].includes(r.status)).length],
    ['LLM / Judge', health.llm_model + ' / ' + health.judge_model]];
  view.innerHTML = `
    <div class="grid g4">${cards.map(c => `<div class="card"><div class="muted">${c[0]}</div><div style="font-size:22px;font-weight:700;margin-top:3px">${esc(c[1])}</div></div>`).join('')}</div>
    <div class="card"><h2>最近评测任务</h2><table>
    <tr><th>ID</th><th>名称</th><th>模式</th><th>状态</th><th>进度</th><th>创建时间</th></tr>
    ${runs.slice(0, 12).map(r => `<tr>
      <td>${r.id}</td><td><a href="#" onclick="showRun(${r.id});return false">${esc(r.name)}</a></td>
      <td>${r.mode.toUpperCase()}</td>
      <td class="${r.status==='done'?'s-ok':(r.status==='failed'?'s-bad':'s-run')}">${r.status}</td>
      <td><div class="bar"><div style="width:${r.total_cases?Math.round(100*r.progress/r.total_cases):0}%"></div></div></td>
      <td class="muted">${(r.created_at||'').slice(0,19)}</td></tr>`).join('')}</table>
    ${runs.length ? '' : '<p class="muted">还没有评测任务，去「评测任务」创建一个。</p>'}</div>`;
}

// ---------- Agent 管理 ----------
const AGENT_TYPE_DESC = {prompt:'Prompt 纯推理', rag:'RAG 检索增强', tool:'Tool 工具调用', external_http:'外部 HTTP 服务', external_cli:'外部 CLI 进程'};
async function agents(){
  const list = await api('/agents');
  view.innerHTML = `
    <div class="card"><div class="row"><h2 style="margin:0;flex:1">Agent 列表（${list.length}）</h2>
      <button class="act" onclick="newAgentDlg()">+ 注册 Agent</button></div></div>
    ${list.map(a => `
    <div class="card"><div class="row">
      <b style="font-size:15px">${esc(a.name)}</b>
      <span class="pill">${esc(a.type)} · ${AGENT_TYPE_DESC[a.type] || ''}</span>
      <span class="muted" style="flex:1">${esc(a.description)}</span>
      <button class="ghost" data-agent="${esc(JSON.stringify(a))}" onclick="testAgentDlg(${a.id}, this.dataset.agent)">试跑</button>
    </div>
    <table><tr><th>版本</th><th>配置</th><th>说明</th><th>时间</th></tr>
    ${a.versions.map(v => `<tr><td><b>${v.version}</b> (#${v.id})</td>
      <td><pre style="max-height:110px;margin:0">${esc(JSON.stringify(v.config, null, 1))}</pre></td>
      <td class="muted">${esc(v.note)}</td><td class="muted">${(v.created_at||'').slice(0,19)}</td></tr>`).join('')}
    </table></div>`).join('')}`;
}
function newAgentDlg(){
  openDlg(`<h2>注册 Agent</h2>
  <label>名称</label><input id="na-name" style="width:60%">
  <label>类型</label><select id="na-type">${Object.keys(AGENT_TYPE_DESC).map(t=>`<option>${t}</option>`).join('')}</select>
  <label>描述</label><input id="na-desc" style="width:100%">
  <label>配置 JSON（如 {"base_url":"http://..."} 或 {"argv":["dsh","--profile","headless","{input}"]}）</label>
  <textarea id="na-config" rows="6" style="width:100%">{}</textarea>
  <div class="row" style="margin-top:14px"><button class="act" onclick="createAgent()">创建</button>
  <button class="ghost" onclick="closeDlg()">取消</button></div>`);
}
async function createAgent(){
  try{
    await post('/agents', {name: $('#na-name').value, type: $('#na-type').value,
      description: $('#na-desc').value, config: JSON.parse($('#na-config').value || '{}')});
    closeDlg(); agents();
  }catch(e){ alert('创建失败：' + JSON.stringify(e)); }
}
function testAgentDlg(id, aJson){
  const a = JSON.parse(aJson);
  openDlg(`<h2>试跑 ${esc(a.name)}</h2>
  <label>输入</label><textarea id="ta-input" rows="5" style="width:100%">法国的首都是哪里？</textarea>
  <div class="row" style="margin-top:12px"><button class="act" onclick="runTest(${id})">执行</button>
  <button class="ghost" onclick="closeDlg()">关闭</button></div><div id="ta-out"></div>`);
}
async function runTest(id){
  $('#ta-out').innerHTML = '<p class="muted">执行中…</p>';
  try{
    const r = await post(`/agents/${id}/test`, {input: $('#ta-input').value});
    $('#ta-out').innerHTML = `<h3>输出（${r.latency_ms}ms${r.error?' · <span class="s-bad">error: '+esc(r.error)+'</span>':''}）</h3>
      <pre>${esc(r.output)}</pre><h3>轨迹</h3><pre>${esc(JSON.stringify(r.intermediate, null, 1))}</pre>`;
  }catch(e){ $('#ta-out').innerHTML = '<p class="s-bad">失败：'+esc(JSON.stringify(e))+'</p>'; }
}

// ---------- 评测集 ----------
async function datasets(){
  const list = await api('/datasets');
  view.innerHTML = `
    <div class="card"><div class="row"><h2 style="margin:0;flex:1">评测集（${list.length}）</h2>
    <button class="act" onclick="importDlg()">⬆ JSON 批量导入</button></div></div>
    ${list.map(d => `
    <div class="card"><div class="row">
      <b style="font-size:15px">${esc(d.name)}</b><span class="pill">草稿 ${d.draft_count} 条</span>
      <span class="muted" style="flex:1">${esc(d.description)}</span>
      <button class="ghost" onclick="publishDlg(${d.id})">发布新版本</button>
      <button class="ghost" onclick="qualityDlg(${d.id})">质检</button>
      <button class="ghost" onclick="showDataset(${d.id})">查看</button></div>
      ${d.versions.length ? `<table><tr><th>已发布版本</th><th>样本数</th><th>发布时间</th><th></th></tr>
      ${d.versions.map(v=>`<tr><td><b>${v.version}</b> (#${v.id})</td><td>${v.case_count}</td>
      <td class="muted">${(v.created_at||'').slice(0,19)}</td>
      <td><a href="#" onclick="exportDs(${v.id});return false">导出 JSON</a></td></tr>`).join('')}</table>`
      : '<p class="muted">尚未发布版本（草稿质检通过后可发布冻结快照）</p>'}</div>`).join('')}`;
}
function importDlg(){
  openDlg(`<h2>JSON 批量导入（新建数据集）</h2>
  <label>数据集名称</label><input id="im-name" style="width:50%">
  <label>适用类型（逗号分隔：prompt,rag,tool）</label><input id="im-types" value="prompt,rag,tool" style="width:50%">
  <label>样本 JSON 数组（字段：input / expected_output / reference_context / tools_spec / difficulty / tags）</label>
  <textarea id="im-cases" rows="10" style="width:100%"></textarea>
  <div class="row" style="margin-top:12px">
    <button class="act" onclick="doImport(false)">① 预检</button>
    <button class="ghost" onclick="doImport(true)">② 确认导入</button>
    <button class="ghost" onclick="closeDlg()">取消</button></div>
    <div id="im-out" style="margin-top:10px"></div>`);
}
async function doImport(confirm){
  try{
    const cases = JSON.parse($('#im-cases').value);
    const name = $('#im-name').value.trim();
    let dsId;
    const exist = (await api('/datasets')).find(d => d.name === name);
    if (exist){ dsId = exist.id; } else { dsId = (await post('/datasets', {name, target_types: $('#im-types').value})).id; }
    const r = await post(`/datasets/${dsId}/import`, {cases, confirm});
    $('#im-out').innerHTML = confirm ? `<p class="s-ok">✓ 已导入 ${r.imported} 条</p>` :
      `<pre>${esc(JSON.stringify(r.quality, null, 1))}</pre><p class="muted">预检完成：阻断 ${r.quality.blockers} · 提醒 ${r.quality.warnings}。确认无误后点「确认导入」。</p>`;
    if (confirm) datasets();
  }catch(e){ $('#im-out').innerHTML = '<p class="s-bad">'+esc(JSON.stringify(e))+'</p>'; }
}
async function showDataset(id){
  const d = await api('/datasets/' + id);
  const v = d.versions[d.versions.length-1];
  const detail = v ? await api(`/datasets/${id}/versions/${v.id}`) : {cases: d.draft.cases};
  openDlg(`<h2>${esc(d.name)} · ${v ? '版本 '+v.version : '草稿'}</h2>
  <table><tr><th>#</th><th>输入</th><th>期望输出</th><th>难度</th><th>标签</th></tr>
  ${detail.cases.map(c=>`<tr><td>${c.seq}</td><td>${esc(c.input.slice(0,80))}</td>
  <td class="muted">${esc((c.expected_output||'').slice(0,80))}</td><td>${esc(c.difficulty)}</td>
  <td>${Object.entries(c.tags||{}).map(([k,vv])=>`<span class="pill">${k}:${esc(vv)}</span>`).join('')}</td></tr>`).join('')}
  </table><div class="row" style="margin-top:12px"><button class="ghost" onclick="closeDlg()">关闭</button></div>`);
}
async function exportDs(vid){
  const r = await api('/datasets/0/versions/' + vid + '/export');
  downloadFile(JSON.stringify(r, null, 1), `dataset_v${vid}.json`);
}
function downloadFile(text, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type:'application/json'}));
  a.download = name; a.click();
}
async function publishDlg(id){
  try{
    const r = await post(`/datasets/${id}/publish`, {note: 'console 发布'});
    alert('已发布 ' + r.version + '（' + r.case_count + ' 样本）');
    datasets();
  }catch(e){
    alert('发布被阻断：' + JSON.stringify(e.detail ? e.detail.quality ? e.detail.quality.by_rule : e.detail : e));
  }
}
async function qualityDlg(id){
  const r = await post(`/datasets/${id}/quality-check`, {});
  openDlg(`<h2>质检报告</h2><p>阻断 ${r.blockers} · 提醒 ${r.warnings}</p>
  <table><tr><th>级别</th><th>规则</th><th>样本</th><th>详情</th></tr>
  ${r.issues.map(i=>`<tr><td class="${i.level==='blocker'?'s-bad':''}">${i.level}</td><td>${i.rule}</td>
  <td>#${i.seq ?? '-'}</td><td class="muted">${esc(i.detail)}</td></tr>`).join('')}</table>
  <div class="row" style="margin-top:12px"><button class="ghost" onclick="closeDlg()">关闭</button></div>`);
}

// ---------- 评测任务 ----------
async function runs(){
  const [runs, agents, dss] = await Promise.all([api('/runs'), api('/agents'), api('/datasets')]);
  const avOpts = agents.flatMap(a => a.versions.map(v => `<option value="${v.id}">${esc(a.name)} · ${v.version} (${a.type})</option>`)).join('');
  const dsOpts = dss.flatMap(d => d.versions.filter(v=>v.version!=='draft').map(v => `<option value="${v.id}">${esc(d.name)} · ${v.version}</option>`)).join('');
  view.innerHTML = `
  <div class="card"><h2>新建评测任务</h2>
  <div class="row"><label style="margin:0">名称</label><input id="nr-name" value="评测 ${new Date().toISOString().slice(0,16).replace('T',' ')}" style="width:230px">
  <label style="margin:0">A（被测）</label><select id="nr-a">${avOpts}</select>
  <label style="margin:0">B（对比，可选）</label><select id="nr-b"><option value="">— 单独评测 —</option>${avOpts}</select></div>
  <div class="row" style="margin-top:8px"><label style="margin:0">数据集版本</label><select id="nr-ds">${dsOpts}</select>
  <label style="margin:0">并发</label><input id="nr-cc" type="number" value="3" min="1" max="8" style="width:70px">
  <button class="act" onclick="createRun()">🚀 发起评测</button></div></div>
  <div class="card"><h2>任务列表</h2><table>
  <tr><th>ID</th><th>名称</th><th>模式</th><th>状态</th><th>进度</th><th>操作</th></tr>
  ${runs.map(r => `<tr><td>${r.id}</td>
  <td><a href="#" onclick="showRun(${r.id});return false">${esc(r.name)}</a><div class="muted">${r.sides.map(s=>esc(s.agent_name+'/'+s.version)).join(' vs ')}</div></td>
  <td>${r.mode.toUpperCase()}</td>
  <td class="${r.status==='done'?'s-ok':(r.status==='failed'?'s-bad':'s-run')}">${r.status}</td>
  <td>${r.progress}/${r.total_cases}<div class="bar"><div style="width:${r.total_cases?Math.round(100*r.progress/r.total_cases):0}%"></div></div></td>
  <td>${['done','failed','cancelled'].includes(r.status) ? `<button class="ghost" onclick="retryRun(${r.id})">重跑</button>` : `<button class="ghost" onclick="cancelRun(${r.id})">取消</button>`}</td>
  </tr>`).join('')}</table></div>`;
}
async function createRun(){
  const ids = [parseInt($('#nr-a').value)];
  if ($('#nr-b').value) ids.push(parseInt($('#nr-b').value));
  try{
    const r = await post('/runs', {name: $('#nr-name').value, agent_version_ids: ids,
      dataset_version_id: parseInt($('#nr-ds').value), concurrency: parseInt($('#nr-cc').value)});
    alert('已创建 Run #' + r.id + '，正在后台执行');
    runs();
  }catch(e){ alert('创建失败：' + JSON.stringify(e)); }
}
async function retryRun(id){ await post(`/runs/${id}/retry`, {}); runs(); }
async function cancelRun(id){ await post(`/runs/${id}/cancel`, {}); runs(); }
async function showRun(id){
  const r = await api('/runs/' + id);
  let report = '';
  if (r.status === 'done'){
    try{
      const rep = await api(`/runs/${id}/report`);
      report = `<p><a href="/api/runs/${id}/report/html" target="_blank">📋 打开完整 HTML 报告</a>
      <span class="muted">（本地文件：${esc(rep.html_path)}）</span></p>`;
    }catch(e){}
  }
  openDlg(`<h2>Run #${r.id} · ${esc(r.name)}</h2>
  <p>模式 ${r.mode.toUpperCase()} · 状态 <b class="${r.status==='done'?'s-ok':'s-run'}">${r.status}</b> ·
  Judge ${esc(r.judge_model)}/${esc(r.judge_mode)} · 进度 ${r.progress}/${r.total_cases}
  ${r.error ? '<br><span class="s-bad">'+esc(r.error)+'</span>' : ''}</p>${report}
  <table><tr><th>Agent</th><th>版本</th><th>类型</th></tr>
  ${r.sides.map(s=>`<tr><td>${esc(s.agent_name)}</td><td>${s.version}</td><td>${esc(s.agent_type)}</td></tr>`).join('')}</table>
  <div class="row" style="margin-top:12px"><button class="ghost" onclick="closeDlg();render('runs')">关闭</button></div>`);
}

// ---------- 数据治理 ----------
async function gov(){
  const [tags, qrs] = await Promise.all([api('/governance/tags'), api('/governance/quality-reports')]);
  view.innerHTML = `
  <div class="card"><div class="row"><h2 style="margin:0;flex:1">统一标签体系</h2>
  <input id="tg-cat" placeholder="类别" style="width:90px"><input id="tg-val" placeholder="值" style="width:120px">
  <input id="tg-lab" placeholder="显示名" style="width:120px"><button class="act" onclick="addTag()">+ 添加</button></div></div>
  ${Object.entries(tags).map(([cat, list]) => `
  <div class="card"><h2>${cat}</h2><div class="row">
  ${list.map(t=>`<span class="pill" style="${t.enabled?'':'opacity:.4'}">${esc(t.value)}${t.label&&t.label!==t.value?' ('+esc(t.label)+')':''}</span>`).join('')}</div></div>`).join('')}
  <div class="card"><h2>质量报告（最近）</h2><table>
  <tr><th>ID</th><th>数据集</th><th>触发</th><th>阻断</th><th>提醒</th><th>时间</th></tr>
  ${qrs.map(q=>`<tr><td>${q.id}</td><td>#${q.dataset_id}</td><td>${q.triggered_by}</td>
  <td class="${q.blockers?'s-bad':''}">${q.blockers}</td><td>${q.warnings}</td>
  <td class="muted">${(q.created_at||'').slice(0,19)}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">暂无</td></tr>'}</table></div>`;
}
async function addTag(){
  try{ await post('/governance/tags', {category: $('#tg-cat').value, value: $('#tg-val').value, label: $('#tg-lab').value}); gov(); }
  catch(e){ alert('添加失败：' + JSON.stringify(e)); }
}

// ---------- 系统设置 ----------
async function sys(){
  const s = await api('/system/settings');
  const dims = await api('/dimensions');
  view.innerHTML = `
  <div class="card"><h2>系统配置（.env）</h2><table>
  <tr><th>项</th><th>值</th></tr>
  <tr><td>被测 LLM</td><td>${esc(s.llm_base_url)} · ${esc(s.llm_model)} · key ${esc(s.llm_api_key_masked)}</td></tr>
  <tr><td>Judge LLM</td><td>${esc(s.judge_base_url)} · ${esc(s.judge_model)} · key ${esc(s.judge_api_key_masked)}</td></tr>
  <tr><td>并发（执行/评分）</td><td>${s.exec_concurrency} / ${s.judge_concurrency}</td></tr>
  <tr><td>通过阈值</td><td>${s.pass_threshold} / 5</td></tr>
  <tr><td>Langfuse</td><td>${s.langfuse_enabled ? '✓ 已启用（' + esc(s.langfuse_host) + '）' : '未配置 → 本地 JSON Trace 降级'}</td></tr>
  <tr><td>数据库</td><td>${esc(s.database_url_masked)}</td></tr></table>
  <p class="muted">修改配置请编辑 backend/.env 后重启服务。</p></div>
  <div class="card"><h2>评测维度（${dims.length}）</h2><table>
  <tr><th>code</th><th>名称</th><th>权重</th><th>内置</th><th>启用</th><th>Rubric 摘要</th></tr>
  ${dims.map(d=>`<tr><td>${d.code}</td><td>${esc(d.name)}</td><td>${d.weight}</td>
  <td>${d.is_builtin?'✓':''}</td><td>${d.enabled?'✓':'—'}</td>
  <td class="muted">${esc(d.rubric.slice(0,60))}…</td></tr>`).join('')}</table></div>`;
}

function render(t){ ({dash, agents, datasets, runs, gov, sys})[t](); }
render('dash');
setInterval(() => { const cur = document.querySelector('nav button.on').dataset.t;
  if (cur === 'dash' || cur === 'runs') render(cur); }, 5000);
</script>
